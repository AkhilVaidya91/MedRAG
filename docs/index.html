<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radiology Report Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            color: #2c3e50;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: white;
            padding: 30px 0;
            margin-bottom: 30px;
            border-bottom: 1px solid #e0e0e0;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-top: 8px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .panel {
            background: white;
            border-radius: 8px;
            padding: 30px;
            border: 1px solid #e0e0e0;
        }

        .panel h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #1a1a1a;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #444;
            font-size: 14px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px dashed #d0d0d0;
            border-radius: 6px;
            cursor: pointer;
            transition: border-color 0.3s;
            background: #fafafa;
        }

        input[type="file"]:hover {
            border-color: #999;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 12px;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #666;
        }

        .image-preview {
            margin-top: 15px;
            max-width: 100%;
            max-height: 300px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            display: none;
        }

        button {
            background: #2c3e50;
            color: white;
            padding: 14px 32px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }

        button:hover:not(:disabled) {
            background: #1a252f;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2c3e50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
        }

        .alert {
            padding: 16px 20px;
            border-radius: 6px;
            margin-bottom: 25px;
            border-left: 4px solid;
        }

        .alert-success {
            background: #f0fdf4;
            border-color: #22c55e;
            color: #166534;
        }

        .alert-error {
            background: #fef2f2;
            border-color: #ef4444;
            color: #991b1b;
        }

        .alert h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .corrected-report {
            background: #f9fafb;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .reference-cases {
            margin-top: 30px;
        }

        .reference-cases h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #1a1a1a;
        }

        .case-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .case-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
        }

        .case-card h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #444;
        }

        .case-image {
            width: 100%;
            height: 200px;
            object-fit: contain;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .case-details {
            font-size: 13px;
            color: #555;
        }

        .case-details strong {
            display: block;
            margin-top: 12px;
            margin-bottom: 4px;
            color: #333;
        }

        .case-details p {
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .error-message {
            background: #fef2f2;
            color: #991b1b;
            padding: 16px 20px;
            border-radius: 6px;
            border: 1px solid #fecaca;
            margin-top: 20px;
            display: none;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .case-grid {
                grid-template-columns: 1fr;
            }
        }

        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3 {
            margin-top: 16px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .markdown-content p {
            margin-bottom: 12px;
        }

        .markdown-content ul,
        .markdown-content ol {
            margin-left: 24px;
            margin-bottom: 12px;
        }

        .markdown-content li {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Radiology Report Verification</h1>
            <p class="subtitle">AI-powered verification using MedSigLIP embeddings and Gemini analysis</p>
        </div>
    </header>

    <div class="container">
        <div class="main-content">
            <div class="panel">
                <h2>Upload X-ray Image</h2>
                <div class="form-group">
                    <label for="imageFile">Select X-ray Image</label>
                    <input type="file" id="imageFile" accept="image/*" required>
                    <img id="imagePreview" class="image-preview" alt="Preview">
                </div>
            </div>

            <div class="panel">
                <h2>Radiology Report</h2>
                <div class="form-group">
                    <label for="reportText">Enter Report Text</label>
                    <textarea id="reportText" placeholder="Enter the radiology report here..." required></textarea>
                </div>
            </div>
        </div>

        <div class="panel">
            <button id="verifyBtn" onclick="verifyReport()">Verify Report</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing report with AI... This may take a moment.</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="results" id="results">
            <div class="panel">
                <div id="verificationResult"></div>
            </div>

            <div class="reference-cases">
                <div class="panel">
                    <h2>Reference Cases (Top 3 Similar Cases)</h2>
                    <div class="case-grid" id="referenceCases"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://akhil-vaidya-medrag-backend.hf.space/api/verify-report';

        // Image preview functionality
        document.getElementById('imageFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('imagePreview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // Markdown to HTML converter (simple)
        function markdownToHtml(markdown) {
            if (!markdown) return '';
            
            let html = markdown;
            
            // Headers
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
            
            // Bold
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            
            // Lists
            html = html.replace(/^\* (.*$)/gim, '<li>$1</li>');
            html = html.replace(/^\d+\. (.*$)/gim, '<li>$1</li>');
            
            // Wrap consecutive list items in ul/ol
            html = html.replace(/(<li>.*<\/li>)/gim, '<ul>$1</ul>');
            html = html.replace(/<\/ul>\n<ul>/g, '\n');
            
            // Paragraphs
            html = html.split('\n\n').map(para => {
                if (!para.startsWith('<') && para.trim()) {
                    return '<p>' + para + '</p>';
                }
                return para;
            }).join('\n');
            
            return html;
        }

        async function verifyReport() {
            const imageFile = document.getElementById('imageFile').files[0];
            const reportText = document.getElementById('reportText').value;

            // Validation
            if (!imageFile) {
                showError('Please select an X-ray image');
                return;
            }

            if (!reportText.trim()) {
                showError('Please enter the radiology report text');
                return;
            }

            // Hide previous results and errors
            document.getElementById('results').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';

            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('verifyBtn').disabled = true;

            try {
                // Prepare form data
                const formData = new FormData();
                formData.append('image', imageFile);
                formData.append('report_text', reportText);

                // Make API call
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'API request failed');
                }

                const data = await response.json();
                displayResults(data);

            } catch (error) {
                console.error('Error:', error);
                showError('Error: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('verifyBtn').disabled = false;
            }
        }

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            const verificationResult = document.getElementById('verificationResult');
            const referenceCases = document.getElementById('referenceCases');

            // Display verification result
            if (data.isCorrect) {
                verificationResult.innerHTML = `
                    <div class="alert alert-success">
                        <h3>✓ Report Verified</h3>
                        <p>The radiology report is complete and accurate based on the X-ray analysis.</p>
                    </div>
                `;
            } else {
                const correctedHtml = markdownToHtml(data.correctReport);
                verificationResult.innerHTML = `
                    <div class="alert alert-error">
                        <h3>⚠ Report Needs Correction</h3>
                        <p>The analysis identified issues with the report. See the corrected version below:</p>
                    </div>
                    <div class="corrected-report markdown-content">
                        ${correctedHtml}
                    </div>
                `;
            }

            // Display reference cases
            referenceCases.innerHTML = data.referenceCases.map((caseData, index) => `
                <div class="case-card">
                    <h3>Case ${index + 1} (ID: ${caseData.id})</h3>
                    <img src="data:image/png;base64,${caseData.imageBase64}" 
                         alt="Reference case ${index + 1}" 
                         class="case-image">
                    <div class="case-details">
                        <strong>Findings:</strong>
                        <p>${caseData.findings || 'N/A'}</p>
                        <strong>Impression:</strong>
                        <p>${caseData.impression || 'N/A'}</p>
                    </div>
                </div>
            `).join('');

            resultsDiv.style.display = 'block';
            resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            errorDiv.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
